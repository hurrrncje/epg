name: Update cleaned EPG

on:
  schedule:
    # Every three hours from 14:45 UK time. GitHub may delay scheduled runs.
    - cron: "45 2-23/3 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cleaned-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download, clean, and gzip EPG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python clean_epg.py

      - name: Commit refreshed EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleaned_epg.xml.gz ai_cache.json
          if git diff --cached --quiet; then
            echo "EPG has not changed; nothing to commit."
          else
            git commit -m "Update cleaned EPG"
            git push
          fi
